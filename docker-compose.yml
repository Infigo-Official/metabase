# Local build-and-run for the Infigo Metabase fork.
#
#   docker compose up -d --build
#
# Builds the image from this repo (so the fork's changes are actually in it) and runs it against a
# throwaway Postgres. For a richer local environment (SQL Server, reporting DB, pgAdmin) point that
# compose file at the image tag built here instead — see LocalSetup.md.
#
# NOTE: .dockerignore excludes .git, so the build cannot derive its own version. VERSION is passed
# in explicitly below; override with MB_VERSION if you want the tag to say something else.

services:
  metabase:
    container_name: infigo-metabase-dev
    image: infigo-metabase:${MB_VERSION:-v0.63.15}
    build:
      context: .
      args:
        MB_EDITION: oss
        VERSION: ${MB_VERSION:-v0.63.15}
    depends_on:
      db:
        condition: service_healthy
    ports: ["${MB_HOST_PORT:-3000}:3000"]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_JETTY_PORT: 3000
    volumes:
      - plugins:/plugins
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 20

  db:
    container_name: infigo-metabase-dev-db
    image: postgres:17
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
      POSTGRES_DB: metabase
    ports: ["${MB_DB_HOST_PORT:-55434}:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  plugins:
